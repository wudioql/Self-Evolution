<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设备故障模式库 · Equipment Failure Mode Library</title>
<style>
  :root{
    --bg:#12161c; --bg2:#181d25; --bg3:#1f252f; --bd:#2b3341; --bd2:#3a4454;
    --fg:#e6ebf2; --fg2:#a3aec0; --fg3:#6b7686;
    --ac:#4da3ff; --ac2:#3d8ce0;
    --ok:#3ecf8e; --warn:#f0b23c; --err:#f2685f; --purple:#a97bf0;
    --radius:10px;
  }
  html[data-theme="light"]{
    --bg:#f5f7fa; --bg2:#ffffff; --bg3:#eef2f7; --bd:#dde3ec; --bd2:#c6cfdb;
    --fg:#1a2029; --fg2:#5a6675; --fg3:#8b96a5;
    --ac:#1f7ae0; --ac2:#1867c0;
    --ok:#129b62; --warn:#b57a10; --err:#d1483e; --purple:#7d4fd1;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:6px}
  ::-webkit-scrollbar-thumb:hover{background:var(--fg3)}

  /* ---------- layout ---------- */
  .wrap{max-width:1360px;margin:0 auto;padding:0 18px 80px}

  header{
    position:sticky; top:0; z-index:50;
    background:var(--bg2); border-bottom:1px solid var(--bd);
    padding:10px 18px; margin-bottom:16px;
  }
  .hdr-in{max-width:1360px;margin:0 auto}
  .hdr-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .logo{font-size:16px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
  .logo span{color:var(--ac)}
  .spacer{flex:1}
  .hdr-btns{display:flex;gap:6px;flex-wrap:wrap}

  .search-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .search{flex:1;min-width:240px;position:relative}
  .search input{
    width:100%;padding:9px 34px 9px 32px;background:var(--bg3);
    border:1px solid var(--bd);border-radius:8px;color:var(--fg);font-size:14px;outline:none;
  }
  .search input:focus{border-color:var(--ac)}
  .search .ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--fg3);font-size:13px}
  .search .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);color:var(--fg3);cursor:pointer;font-size:16px;line-height:1;padding:2px 4px}
  .search .clr:hover{color:var(--fg)}

  .filters{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;align-items:center}
  .chip{
    padding:4px 11px;background:var(--bg3);border:1px solid var(--bd);border-radius:20px;
    font-size:12px;color:var(--fg2);cursor:pointer;user-select:none;white-space:nowrap;
  }
  .chip:hover{border-color:var(--bd2);color:var(--fg)}
  .chip.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
  .flabel{font-size:12px;color:var(--fg3);margin-right:2px}

  /* ---------- buttons ---------- */
  button,.btn{
    padding:7px 13px;background:var(--bg3);border:1px solid var(--bd);border-radius:7px;
    color:var(--fg);font-size:13px;cursor:pointer;font-family:inherit;transition:.12s;white-space:nowrap;
  }
  button:hover,.btn:hover{background:var(--bd);border-color:var(--bd2)}
  .btn-pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
  .btn-pri:hover{background:var(--ac2);border-color:var(--ac2)}
  .btn-danger{color:var(--err)}
  .btn-danger:hover{background:var(--err);color:#fff;border-color:var(--err)}
  .btn-sm{padding:4px 9px;font-size:12px;border-radius:6px}
  .btn-ghost{background:transparent}

  /* ---------- stats ---------- */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
  .stat{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--radius);padding:12px 14px}
  .stat .k{font-size:11px;color:var(--fg3);letter-spacing:.5px;text-transform:uppercase}
  .stat .v{font-size:24px;font-weight:700;margin-top:2px;line-height:1.2}
  .stat .s{font-size:11px;color:var(--fg3);margin-top:1px}
  .stat.a .v{color:var(--ac)} .stat.r .v{color:var(--err)}
  .stat.o .v{color:var(--ok)} .stat.w .v{color:var(--warn)}

  .panels{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
  @media(max-width:860px){.panels{grid-template-columns:1fr}}
  .panel{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--radius);padding:13px 15px}
  .panel h3{font-size:12px;color:var(--fg3);font-weight:600;letter-spacing:.5px;text-transform:uppercase;margin-bottom:10px}
  .bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12px}
  .bar-row .nm{width:80px;flex-shrink:0;color:var(--fg2);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar-row .tr{flex:1;background:var(--bg3);border-radius:4px;height:16px;overflow:hidden}
  .bar-row .fi{height:100%;background:var(--ac);border-radius:4px;transition:width .3s}
  .bar-row .fi.rec{background:var(--err)}
  .bar-row .ct{width:38px;flex-shrink:0;color:var(--fg2);text-align:right;font-variant-numeric:tabular-nums}
  .empty-hint{color:var(--fg3);font-size:12px;padding:6px 0}

  /* ---------- list ---------- */
  .list-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
  .count{font-size:13px;color:var(--fg2)}
  .count b{color:var(--fg)}

  .card{
    background:var(--bg2);border:1px solid var(--bd);border-radius:var(--radius);
    margin-bottom:9px;overflow:hidden;transition:.12s;
  }
  .card:hover{border-color:var(--bd2)}
  .card.open{border-color:var(--ac)}
  .chead{padding:11px 14px;cursor:pointer;display:flex;align-items:flex-start;gap:10px}
  .cdot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:7px}
  .cmain{flex:1;min-width:0}
  .ctitle{font-weight:600;font-size:14px;line-height:1.45}
  .cmeta{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px;align-items:center}
  .tag{
    padding:1.5px 7px;background:var(--bg3);border:1px solid var(--bd);border-radius:4px;
    font-size:11px;color:var(--fg2);white-space:nowrap;
  }
  .tag.eq{color:var(--ac);border-color:var(--ac);background:transparent}
  .tag.cat{color:var(--purple);border-color:var(--purple);background:transparent}
  .tag.rec{color:var(--err);border-color:var(--err);background:transparent;font-weight:600}
  .tag.ok{color:var(--ok);border-color:var(--ok);background:transparent}
  .tag.date{color:var(--fg3)}
  .cside{display:flex;gap:4px;flex-shrink:0;align-items:center}
  .cbody{
    display:none;padding:0 14px 14px;border-top:1px solid var(--bd);
    margin-top:0;padding-top:13px;
  }
  .card.open .cbody{display:block}
  .fld{margin-bottom:11px}
  .fld .lb{font-size:11px;color:var(--fg3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
  .fld .vl{font-size:13.5px;color:var(--fg);white-space:pre-wrap;word-break:break-word}
  .fld .vl.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px}
  .fld .vl:empty::after{content:"—";color:var(--fg3)}
  .fld-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:11px}
  .cfoot{display:flex;gap:6px;margin-top:12px;padding-top:11px;border-top:1px dashed var(--bd)}

  .sens{background:rgba(242,104,95,.1);border-left:3px solid var(--err);padding:6px 10px;border-radius:0 5px 5px 0}

  /* ---------- modal ---------- */
  .mask{
    position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;
    display:none;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto;
  }
  .mask.on{display:flex}
  .modal{
    background:var(--bg2);border:1px solid var(--bd2);border-radius:12px;
    width:100%;max-width:860px;box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  .mhead{padding:14px 18px;border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:10px}
  .mhead h2{font-size:16px;font-weight:700}
  .mbody{padding:16px 18px;max-height:calc(100vh - 220px);overflow-y:auto}
  .mfoot{padding:12px 18px;border-top:1px solid var(--bd);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
  .x{margin-left:auto;background:transparent;border:none;font-size:22px;color:var(--fg3);cursor:pointer;padding:0 4px;line-height:1}
  .x:hover{color:var(--fg);background:transparent}

  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  @media(max-width:700px){.form-grid{grid-template-columns:1fr}}
  .fg{display:flex;flex-direction:column;gap:4px}
  .fg.full{grid-column:1/-1}
  .fg label{font-size:12px;color:var(--fg2);font-weight:500;display:flex;align-items:center;gap:5px}
  .fg label .warn-dot{color:var(--err);font-size:10px}
  .fg input,.fg select,.fg textarea{
    padding:8px 10px;background:var(--bg3);border:1px solid var(--bd);border-radius:7px;
    color:var(--fg);font-size:13.5px;font-family:inherit;outline:none;width:100%;
  }
  .fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--ac)}
  .fg textarea{resize:vertical;min-height:64px;line-height:1.55}
  .fg .hint{font-size:11px;color:var(--fg3)}
  .sec-title{grid-column:1/-1;font-size:12px;color:var(--ac);font-weight:700;letter-spacing:.6px;
    text-transform:uppercase;margin-top:6px;padding-bottom:5px;border-bottom:1px solid var(--bd)}

  /* ---------- misc ---------- */
  .banner{
    background:rgba(240,178,60,.12);border:1px solid var(--warn);color:var(--warn);
    padding:9px 13px;border-radius:8px;margin-bottom:14px;font-size:13px;
  }
  .banner.err{background:rgba(242,104,95,.12);border-color:var(--err);color:var(--err)}
  .banner.info{background:rgba(77,163,255,.1);border-color:var(--ac);color:var(--ac)}
  .banner b{font-weight:700}
  .banner button{margin-left:8px;padding:2px 8px;font-size:12px}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
    background:var(--ok);color:#fff;padding:10px 20px;border-radius:8px;font-size:13.5px;font-weight:600;
    z-index:500;opacity:0;transition:.25s;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.35);
  }
  .toast.on{transform:translateX(-50%) translateY(0);opacity:1}

  .empty{text-align:center;padding:60px 20px;color:var(--fg3)}
  .empty .big{font-size:40px;margin-bottom:10px;opacity:.5}
  .empty p{font-size:14px;margin-bottom:4px}

  kbd{background:var(--bg3);border:1px solid var(--bd2);border-bottom-width:2px;border-radius:4px;
    padding:1px 5px;font-size:11px;font-family:ui-monospace,monospace;color:var(--fg2)}

  @media print{
    header,.hdr-btns,.cside,.cfoot,.toast,.banner,.stats{display:none!important}
    body{background:#fff;color:#000}
    .card{break-inside:avoid;border-color:#999}
    .cbody{display:block!important}
    .panel{break-inside:avoid}
  }
button[hidden]{display:none}
</style>
</head>
<body data-private="false">

<header>
  <div class="hdr-in">
    <div class="hdr-top">
      <div class="logo">设备故障<span>模式库</span></div>
      <div class="spacer"></div>
      <div class="hdr-btns">
        <button class="btn-pri" onclick="openEditor()">＋ 新增记录</button>
        <button id="connBtn" onclick="fs.connect()">连接项目 JSON（可选）</button>
        <button onclick="fs.reload()">重新载入</button>
        <button onclick="exportJSON()">备份（原始）</button>
        <button onclick="document.getElementById('impFile').click()">导入为草稿</button>
        <button onclick="exportSanitized()">🔒 脱敏导出</button>
        <button onclick="exportCSV()">CSV</button>
        <button onclick="exportMD()">Markdown</button>
        <button class="btn-ghost" onclick="openSettings()">⚙</button>
        <button class="btn-ghost" onclick="toggleTheme()" id="themeBtn">🌙</button>
      </div>
    </div>
    <div class="search-row">
      <div class="search">
        <span class="ico">🔍</span>
        <input id="q" placeholder="搜索：现象 / 报警码 / 根因 / 处理方式 / 排查路径…（Ctrl+K）" oninput="render()">
        <span class="clr" onclick="clearSearch()" id="clrBtn" style="display:none">×</span>
      </div>
    </div>
    <div class="filters" id="filters"></div>
  </div>
</header>

<div class="wrap">
  <div id="sourceStatus" class="banner info"></div>
  <div id="demoWarn"></div>

  <div class="stats" id="stats"></div>

  <div class="panels">
    <div class="panel">
      <h3>真实故障类别分布（不等于根因已证实）</h3>
      <div id="chartCat"></div>
    </div>
    <div class="panel">
      <h3>机台类型分布 · 仅统计真实记录</h3>
      <div id="chartEq"></div>
    </div>
  </div>

  <div class="list-head">
    <div class="count" id="count"></div>
    <div class="spacer"></div>
    <button class="btn-sm" onclick="toggleAll(true)">全部展开</button>
    <button class="btn-sm" onclick="toggleAll(false)">全部收起</button>
    <select id="sortSel" onchange="render()" style="padding:4px 8px;background:var(--bg3);border:1px solid var(--bd);border-radius:6px;color:var(--fg);font-size:12px">
      <option value="date_desc">最近发生</option>
      <option value="date_asc">最早发生</option>
      <option value="downtime_desc">停机时长↓</option>
      <option value="rec_first">复发优先</option>
      <option value="created_desc">最近录入</option>
    </select>
  </div>

  <div id="list"></div>
</div>

<!-- ============ Editor Modal ============ -->
<div class="mask" id="editMask" onclick="if(event.target===this)closeEditor()">
  <div class="modal">
    <div class="mhead">
      <h2 id="editTitle">新增故障记录</h2>
      <button class="x" onclick="closeEditor()">×</button>
    </div>
    <div class="mbody">
      <div class="form-grid">
        <div class="sec-title">① 基本信息</div>
        <div class="fg">
          <label>发生日期</label>
          <input type="date" id="f_date"><div class="hint" id="dateHint">未知日期留空；不会默认伪造成录入日。</div>
        </div>
        <div class="fg">
          <label>机台类型</label>
          <select id="f_eqType"></select>
        </div>
        <div class="fg">
          <label>机台型号 <span class="warn-dot">●</span> 敏感</label>
          <input id="f_eqModel" placeholder="如：TEL Alpha-8SE / AMAT Centura（脱敏导出时会删除）">
          <div class="hint">留空更利于分享</div>
        </div>
        <div class="fg">
          <label>机台编号 <span class="warn-dot">●</span> 敏感</label>
          <input id="f_eqId" placeholder="如：DF01-03（脱敏导出时会删除）">
        </div>
        <div class="fg">
          <label>报警代码 <span class="warn-dot">●</span> 敏感</label>
          <input id="f_alarmCode" placeholder="如：E-1023 / ALM_TC_DEV（脱敏导出时会删除）">
        </div>
        <div class="fg">
          <label>故障类别</label>
          <select id="f_causeCategory"></select>
        </div>

        <div class="sec-title">② 现象与条件</div>
        <div class="fg full">
          <label>现象描述 <span class="warn-dot">●</span> 敏感</label>
          <textarea id="f_symptom" placeholder="机台报什么？屏幕上显示什么？现场听到/看到/闻到什么？"></textarea>
        </div>
        <div class="fg full">
          <label>发生条件 <span class="warn-dot">●</span> 敏感</label>
          <textarea id="f_condition" placeholder="哪个 recipe / 哪个步骤 / 什么频率 / PM 后多久 / 是否只在特定时段（脱敏导出时会删除）"></textarea>
        </div>

        <div class="sec-title">③ 排查与根因</div>
        <div class="fg full">
          <label>排查路径 <span style="color:var(--ok)">★ 最有价值的字段</span></label>
          <textarea id="f_troubleshootPath" placeholder="1 → 2 → 3，我实际怎么查的。&#10;【重要】请把走错的路也记下来 —— 排除法本身就是知识。"></textarea>
        </div>
        <div class="fg full">
          <label>根因</label>
          <textarea id="f_rootCause" placeholder="真正的物理/机理层面的原因。不是『零件坏了』，而是『为什么它会坏』"></textarea>
        </div>
        <div class="fg">
          <label>根因分类标签</label>
          <input id="f_rootCauseTag" placeholder="如：热偶老化 / 密封失效 / matcher 漂移" list="tagList">
          <datalist id="tagList"></datalist>
        </div>
        <div class="fg">
          <label>是否复发</label>
          <select id="f_isRecurring">
            <option value="">待确认</option>
            <option value="0">否（首次）</option>
            <option value="1">是（重复出现）</option>
          </select>
        </div>

        <div class="sec-title">④ 处理与预防</div>
        <div class="fg full">
          <label>处理措施</label>
          <textarea id="f_action" placeholder="换了什么 / 调了什么 / 复位了什么"></textarea>
        </div>
        <div class="fg full">
          <label>预防 / 改善建议 <span style="color:var(--ok)">★</span></label>
          <textarea id="f_prevention" placeholder="改 PM 周期？加检查项？换备件品牌？改 recipe？—— 这一栏是改善提案的来源"></textarea>
        </div>
        <div class="fg">
          <label>停机时长（分钟）</label>
          <input type="number" id="f_downtimeMin" min="0" placeholder="0">
        </div>
        <div class="fg">
          <label>是否已彻底解决</label>
          <select id="f_isSolved">
            <option value="">待确认</option>
            <option value="1">是</option>
            <option value="0">否（临时处理 / 待观察）</option>
          </select>
        </div>
        <div class="fg full">
          <label>相关文件 / 照片路径 <span class="warn-dot">●</span> 敏感</label>
          <input id="f_links" placeholder="本地路径或内部文档编号（脱敏导出时会删除）">
        </div>
        <div class="fg full">
          <label>备注</label>
          <textarea id="f_notes" placeholder="其他想记的"></textarea>
        </div>
      </div>
    </div>
    <div class="mfoot">
      <button class="btn-danger" onclick="deleteCurrent()" id="delBtn" style="display:none;margin-right:auto">删除这条</button>
      <button onclick="closeEditor()">取消</button>
      <button class="btn-pri" onclick="saveItem()">保存（Ctrl+S）</button>
    </div>
  </div>
</div>

<!-- ============ Settings Modal ============ -->
<div class="mask" id="setMask" onclick="if(event.target===this)closeSettings()">
  <div class="modal" style="max-width:600px">
    <div class="mhead">
      <h2>设置</h2>
      <button class="x" onclick="closeSettings()">×</button>
    </div>
    <div class="mbody">
      <div class="fg" style="margin-bottom:16px">
        <label>机台类型列表（每行一个）</label>
        <textarea id="s_eqTypes" style="min-height:110px"></textarea>
        <div class="hint">按你实际负责的机台改。改完点"保存设置"。</div>
      </div>
      <div class="fg" style="margin-bottom:16px">
        <label>故障类别列表（每行一个）</label>
        <textarea id="s_categories" style="min-height:170px"></textarea>
      </div>
      <div class="fg" style="margin-bottom:16px">
        <label>脱敏词表（每行一个，导出时自动替换为 ***）</label>
        <textarea id="s_sensitive" style="min-height:90px" placeholder="填入你的机型名、recipe 名、内部编号等"></textarea>
        <div class="hint">固定敏感字段的值与词表都会从正文替换；ID / 时间戳 / 配置 / 历史不导出。自由文本仍须人工复核。</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;padding-top:8px;border-top:1px solid var(--bd)">
        <button onclick="loadSamples()">载入 3 条示例（不计成果）</button>
        <button class="btn-danger" onclick="clearAll()">清空全部数据</button>
        <button onclick="fs.enableDraft()">临时编辑（不写文件）</button>
        <button id="restoreBtn" onclick="fs.restoreDraft()" hidden>恢复浏览器旧草稿</button>
        <button onclick="window.print()">打印 / 存为 PDF</button>
      </div>
    </div>
    <div class="mfoot">
      <button onclick="closeSettings()">取消</button>

function projectDayInfo(p,ds) {
  const day=dayNumber(ds,p.meta.day0), plan=p.dailyPlan.find(d=>d.date===ds), index=Object.fromEntries(p.weeks.flatMap(w=>w.tasks).map(t=>[t.id,t]));
  const matches=(p.overrides||[]).filter(o=>o.start<=ds&&ds<=o.end);
  const mode=matches.some(o=>o.mode==='night')?'night':matches.length?'low':'normal';
  const overdue=Object.values(index).filter(t=>!t.done&&!t.optional&&t.dueDate<ds);
  let actions=plan?plan.actions.filter(a=>!index[a.taskId].done).map(a=>({...a,optional:!!index[a.taskId].optional})):[];
  const current=actions.find(a=>!a.optional)||actions[0];
  if(current){const pending=(index[current.taskId].dependsOn||[]).map(id=>index[id]).filter(t=>t&&!t.done);
    if(pending.length){const t=pending[0];actions.unshift({taskId:t.id,text:'先推进前置任务：'+t.text+'（只做一小步，不要求一次补完）',optional:false});}}
  if(!actions.length&&day>=1&&day<=p.meta.totalDays){
    const next=Object.values(index).filter(t=>!t.done&&!t.optional&&t.scheduledDate<=ds).sort((a,b)=>a.dueDate.localeCompare(b.dueDate)||a.id.localeCompare(b.id))[0];
    if(next)actions=[{taskId:next.id,text:'推进未完的一小步：'+next.text,optional:false}];
  }
  const ipaPaused=overdue.some(t=>t.track==='sound'||MUSIC_RELEASE_IDS.has(t.id))||p.deliverables.some(d=>d.id.startsWith('song')&&!d.done&&d.dueDate<ds);
  if(ipaPaused)actions=actions.filter(a=>index[a.taskId].track!=='ipa');
  if(mode==='night')actions=[];
  else if(mode==='low')actions=actions.filter(a=>!a.optional).slice(0,1);
  else actions=actions.slice(0,3);
  return {day,mode,actions,overdueCount:overdue.length,ipaPaused,budgetMinutes:mode==='night'?10:mode==='low'?25:plan?plan.budgetMinutes:0};
}
