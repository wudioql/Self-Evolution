<style>
  :root{
    --bg:#12161c; --bg2:#181d25; --bg3:#1f252f; --bd:#2b3341; --bd2:#3a4454;
    --fg:#e6ebf2; --fg2:#a3aec0; --fg3:#6b7686;
    --ac:#4da3ff; --ac2:#3d8ce0;
    --ok:#3ecf8e; --warn:#f0b23c; --err:#f2685f; --purple:#a97bf0; --pink:#f06fb0; --teal:#3ecfcf;
    --radius:10px;
  }
  html[data-theme="light"]{
    --bg:#f5f7fa; --bg2:#ffffff; --bg3:#eef2f7; --bd:#dde3ec; --bd2:#c6cfdb;
    --fg:#1a2029; --fg2:#5a6675; --fg3:#8b96a5;
    --ac:#1f7ae0; --ac2:#1867c0;
    --ok:#129b62; --warn:#b57a10; --err:#d1483e; --purple:#7d4fd1; --pink:#c94b8c; --teal:#1a9c9c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;

  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--bd2);border-radius:6px}
  .wrap{max-width:1080px;margin:0 auto;padding:0 18px 90px}

  header{position:sticky;top:0;z-index:60;background:var(--bg2);border-bottom:1px solid var(--bd);padding:11px 18px;margin-bottom:18px}
  .hdr-in{max-width:1080px;margin:0 auto}
  .hdr-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .logo{font-size:16px;font-weight:700;letter-spacing:.3px}
  .logo span{color:var(--ac)}
  .spacer{flex:1}
  .hdr-btns{display:flex;gap:6px;flex-wrap:wrap}

  button,.btn{padding:7px 13px;background:var(--bg3);border:1px solid var(--bd);border-radius:7px;
    color:var(--fg);font-size:13px;cursor:pointer;font-family:inherit;transition:.12s;white-space:nowrap}
  button:hover,.btn:hover{background:var(--bd);border-color:var(--bd2)}
  .btn-pri{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
  .btn-pri:hover{background:var(--ac2);border-color:var(--ac2)}
  .btn-sm{padding:4px 9px;font-size:12px;border-radius:6px}
  .btn-ghost{background:transparent}
  .btn-danger{color:var(--err)}
  .srcbar{display:flex;align-items:center;gap:10px;margin-top:8px}
  .src-badge{font-size:11px;padding:3px 9px;border-radius:20px;border:1px solid var(--bd);color:var(--fg3);background:var(--bg3)}
  .src-badge.ok{color:#3fb950;border-color:#3fb950}
  .src-badge.warn{color:#d29922;border-color:#d29922}

  /* overall progress */
  .bigbar{background:var(--bg3);border-radius:6px;height:12px;overflow:hidden;margin-top:10px;position:relative}
  .bigbar .fi{height:100%;background:linear-gradient(90deg,var(--ac),var(--ok));transition:width .4s;border-radius:6px}
  .biglbl{display:flex;justify-content:space-between;font-size:12px;color:var(--fg2);margin-top:6px}

  /* deliverables */
  .deliv{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--radius);padding:14px 16px;margin-bottom:16px}
  .deliv h3{font-size:12px;color:var(--fg3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:11px}
  .dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:9px}
  .dbox{display:flex;align-items:flex-start;gap:9px;padding:9px 11px;background:var(--bg3);
    border:1px solid var(--bd);border-radius:8px;cursor:pointer;transition:.12s}
  .dbox:hover{border-color:var(--bd2)}
  .dbox.on{border-color:var(--ok);background:rgba(62,207,142,.08)}
  .dbox .bx{width:17px;height:17px;border:2px solid var(--bd2);border-radius:4px;flex-shrink:0;margin-top:2px;
    display:flex;align-items:center;justify-content:center;font-size:12px;color:transparent;transition:.12s}
  .dbox.on .bx{background:var(--ok);border-color:var(--ok);color:#0b1a13}
  .dbox .tx{font-size:13px;line-height:1.45}
  .dbox .tx small{display:block;color:var(--fg3);font-size:11.5px;margin-top:1px}

  /* checkin */
  .checkin{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--bg2);
    border:1px solid var(--bd);border-radius:var(--radius);padding:13px 16px;margin-bottom:16px}
  .streak{font-size:26px;font-weight:700;color:var(--warn);line-height:1}
  .streak small{display:block;font-size:11px;color:var(--fg3);font-weight:400;letter-spacing:.5px;text-transform:uppercase}
  .dots{display:flex;gap:4px;flex-wrap:wrap}
  .dot{width:19px;height:19px;border-radius:5px;background:var(--bg3);border:1px solid var(--bd);
    font-size:9px;display:flex;align-items:center;justify-content:center;color:var(--fg3)}
  .dot.on{background:var(--ok);border-color:var(--ok);color:#0b1a13;font-weight:700}
  .dot.today{outline:2px solid var(--warn);outline-offset:1px}

  /* filters */
  .filters{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
  .chip{padding:4px 11px;background:var(--bg3);border:1px solid var(--bd);border-radius:20px;
    font-size:12px;color:var(--fg2);cursor:pointer;user-select:none}
  .chip:hover{border-color:var(--bd2);color:var(--fg)}
  .chip.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}

  /* weeks */
  .phase-h{font-size:12px;color:var(--ac);font-weight:700;letter-spacing:.8px;text-transform:uppercase;
    margin:22px 0 10px;padding-bottom:6px;border-bottom:1px solid var(--bd)}
  .week{background:var(--bg2);border:1px solid var(--bd);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
  .week.done{border-color:var(--ok)}
  .week.exempt{border-color:var(--warn);border-style:dashed}
  .week.now{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
  .whead{padding:11px 15px;cursor:pointer;display:flex;align-items:center;gap:11px}
  .wnum{font-size:15px;font-weight:700;min-width:34px}
  .wtitle{flex:1;min-width:0}
  .wtitle .d{font-size:11.5px;color:var(--fg3)}
  .wpct{font-size:12px;color:var(--fg2);font-variant-numeric:tabular-nums}
  .wbar{background:var(--bg3);height:5px;overflow:hidden;border-radius:3px;margin-top:5px}
  .wbar .fi{height:100%;background:var(--ok);transition:width .3s;border-radius:3px}
  .badge{padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
  .badge.ex{background:var(--warn);color:#2a1c00}
  .badge.mil{background:var(--pink);color:#fff}
  .badge.now{background:var(--ac);color:#fff}

  .wbody{display:none;padding:0 15px 14px;border-top:1px solid var(--bd);padding-top:12px}
  .week.open .wbody{display:block}

  .tk{display:flex;align-items:flex-start;gap:9px;padding:6px 0;cursor:pointer;border-radius:6px}
  .tk:hover{background:var(--bg3)}
  .tk .bx{width:16px;height:16px;border:2px solid var(--bd2);border-radius:4px;flex-shrink:0;margin-top:3px;
    display:flex;align-items:center;justify-content:center;font-size:11px;color:transparent;transition:.12s}
  .tk.on .bx{background:var(--ok);border-color:var(--ok);color:#0b1a13}
  .tk .tx{flex:1;font-size:13.5px;line-height:1.5}
  .tk.on .tx{color:var(--fg3);text-decoration:line-through}
  .tk .tr{font-size:10px;padding:1.5px 6px;border-radius:4px;flex-shrink:0;margin-top:3px;font-weight:600;letter-spacing:.3px}

  .tr.equip{background:rgba(169,123,240,.16);color:var(--purple)}
  .tr.jp{background:rgba(62,207,142,.16);color:var(--ok)}
  .tr.pub{background:rgba(240,111,176,.16);color:var(--pink)}
  .tr.key{background:rgba(240,178,60,.18);color:var(--warn)}
  .tr.ipa{background:rgba(62,207,207,.16);color:var(--teal)}

  .note{margin-top:11px;padding-top:11px;border-top:1px dashed var(--bd)}
  .note label{font-size:11px;color:var(--fg3);text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:4px}
  .note textarea{width:100%;min-height:52px;padding:8px 10px;background:var(--bg3);border:1px solid var(--bd);
    border-radius:7px;color:var(--fg);font-size:13px;font-family:inherit;resize:vertical;outline:none}
  .note textarea:focus{border-color:var(--ac)}

  .wcheck{margin-top:10px;padding:8px 11px;background:rgba(240,178,60,.08);border-left:3px solid var(--warn);
    border-radius:0 6px 6px 0;font-size:12.5px;color:var(--fg2)}
  .wcheck b{color:var(--warn)}

  .banner{background:rgba(240,178,60,.12);border:1px solid var(--warn);color:var(--warn);

  .banner.err{background:rgba(242,104,95,.12);border-color:var(--err);color:var(--err)}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
    background:var(--ok);color:#fff;padding:10px 20px;border-radius:8px;font-size:13.5px;font-weight:600;

  .toast.on{transform:translateX(-50%) translateY(0);opacity:1}

    header,.hdr-btns,.filters,.note textarea,.toast,.banner{display:none!important}
    body{background:#fff;color:#000}
    .week{break-inside:avoid;border-color:#999}
    .wbody{display:block!important}
    .note{display:none}
  }

  code{font-size:11px;color:var(--fg3)}button[hidden]{display:none}.dbox{cursor:default}.srcbar{flex-wrap:wrap}
  @media(max-width:760px){.dgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(max-width:600px){header{position:static}.dgrid{grid-template-columns:1fr}.tr{display:none}.wrap{padding:0 12px 50px}.hdr-btns{gap:4px}.hdr-btns button{font-size:11px;padding:5px 8px}.daily h2{font-size:16px}}

    <button class="btn-sm" onclick="window.print()">打印</button>
  </div>
  <div id="weeks"></div>

    <button class="btn-danger" onclick="resetAll()">重置当前进度</button>
  </details>
</div>

const deepCopy = value => JSON.parse(JSON.stringify(value));

function projectToday() {
  const parts = new Intl.DateTimeFormat('en-CA', {timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
  const values = Object.fromEntries(parts.map(p => [p.type,p.value]));
  return values.year+'-'+values.month+'-'+values.day;
}
function projectStamp() { return new Date().toISOString(); }
function dayNumber(ds, origin) { return Math.round((Date.parse(ds+'T00:00:00Z')-Date.parse(origin+'T00:00:00Z'))/86400000); }
function addDays(ds, n) { return new Date(Date.parse(ds+'T00:00:00Z')+n*86400000).toISOString().slice(0,10); }
function validDate(ds) { return typeof ds==='string' && /^\d{4}-\d{2}-\d{2}$/.test(ds) && !ds.startsWith('0000-') && Number.isFinite(Date.parse(ds+'T00:00:00Z')) && addDays(ds,0)===ds; }
function must(test, message) { if(!test) throw new Error(message); }
function recordEvent(data, action, details={}) {
  if(!Array.isArray(data.history)) data.history=[];
  data.history.push({at:projectStamp(),action,...details});
}
function planStats(p) {
  const list=p.weeks.flatMap(w=>w.tasks), done=list.filter(t=>t.done).length;
  return {totalTasks:list.length,doneTasks:done,pct:list.length?Math.round(done/list.length*100):0,
          delivDone:p.deliverables.filter(d=>d.done).length,delivTotal:p.deliverables.length};
}
const isRecord = value => value !== null && typeof value === 'object' && !Array.isArray(value);
const hasOwn = (obj,key) => Object.prototype.hasOwnProperty.call(obj,key);
const integerNumber = (value,minimum=0) => Number.isSafeInteger(value) && value>=minimum;
const MUSIC_RELEASE_IDS = new Set(['4-5','8-2','13-2']);
function validateState(item,asOf,label='记录') {
  must(isRecord(item),label+' 必须为对象');
  must(typeof (hasOwn(item,'done')?item.done:false)==='boolean',label+'.done 必须为布尔值');
  must(typeof (hasOwn(item,'note')?item.note:'')==='string',label+'.note 必须为文本');
  const evidence=hasOwn(item,'evidence')?item.evidence:[];
  must(Array.isArray(evidence)&&evidence.every(x=>typeof x==='string'),label+'.evidence 必须为文本数组');
  must(item.completedOn==null||typeof item.completedOn==='string',label+'.completedOn 必须为日期或 null');
  if(item.completedOn) must(validDate(item.completedOn)&&item.completedOn<=asOf&&item.done===true,label+' 的完成日期无效、在未来或尚未完成');
}
function validateDailyState(checkins,logs,meta,asOf,allowDuplicates=false) {
  must(Array.isArray(checkins),'checkins 必须为日期数组');
  const validActual=ds=>validDate(ds)&&meta.day0<=ds&&ds<=meta.end&&ds<=asOf;
  must(checkins.every(validActual),'打卡日期必须在本计划内且不能在未来');
  must(allowDuplicates||new Set(checkins).size===checkins.length,'打卡日期重复');
  must(isRecord(logs),'dailyLogs 必须为日期索引对象');
  Object.entries(logs).forEach(([ds,log])=>{
    must(validActual(ds),'每日记录日期必须在本计划内且不能在未来');
    must(isRecord(log)&&typeof (hasOwn(log,'note')?log.note:'')==='string','每日记录 / 备注格式无效');
    if(hasOwn(log,'minutes'))must(integerNumber(log.minutes),'每日分钟必须为非负整数；未知时不填');
  });
}
function validatePlan(p,asOf=projectToday()) {
  must(validDate(asOf),'校验基准日期无效');
  must(isRecord(p)&&p.schema==='self-evolution/plan90/v2','不是 v2 进度文件；旧备份请用导入 / agent 合并。');
  const m=p.meta;

  must(Array.isArray(p.weeks)&&p.weeks.length===m.totalWeeks&&m.totalDays===m.totalWeeks*7,'周数 / 总天数不一致');
  must(dayNumber(m.end,m.day0)===m.totalDays,'结束日期与总天数不一致');

  must(validDate(m.day90)&&dayNumber(m.day90,m.day0)===90,'Day 90 日期不一致');

    must(Array.isArray(w.tasks)&&typeof (hasOwn(w,'note')?w.note:'')==='string'&&typeof w.title==='string'&&typeof w.days==='string','周任务 / 标题 / 日号 / 备注无效');

function projectDayInfo(p,ds) {

  const current=actions.find(a=>!a.optional)||actions[0];

    if(pending.length){const t=pending[0];actions.unshift({taskId:t.id,text:'先推进前置任务：'+t.text+'（只做一小步，不要求一次补完）',optional:false});}}

    const next=Object.values(index).filter(t=>!t.done&&!t.optional&&t.scheduledDate<=ds).sort((a,b)=>a.dueDate.localeCompare(b.dueDate)||a.id.localeCompare(b.id))[0];

  }

}

    if(filter==='now'&&(cw===null?(n<1?w.n!==1:true):w.n!==cw))return;
    if((filter==='todo'||filter==='done')&&!visible.length)return;
    if(w.p!==phase){h+=`<div class="phase-h">${esc(PHASES[w.p]||'')}</div>`;phase=w.p;}
    h+=`<div class="week ${completed===total&&total?'done':''} ${w.buffer?'exempt':''} ${w.n===cw?'now':''} ${opened.has(w.n)?'open':''}">
      <button class="whead week-head-button" onclick="toggleWeek(${w.n})" aria-expanded="${opened.has(w.n)}"><span class="wnum">W${w.n}</span><span class="wtitle"><b>${esc(w.title)}</b><span class="d">${esc(w.start)}—${esc(w.end)} · Day ${esc(w.days)}</span>${w.buffer?'<span class="badge ex">浮动缓冲</span>':''} ${w.milestone?'<span class="badge mil">'+esc(w.milestone)+'</span>':''}</span><span class="wpct">${completed}/${total}</span></button>
      <div class="wbody">${w.warn?'<div class="wcheck">'+esc(w.warn)+'</div>':''}
      ${visible.map(t=>`<div class="tk ${t.done?'on':''}" id="task-${t.id}"><button class="check-button" aria-label="${esc(t.id+' '+t.text)}" aria-pressed="${t.done}" onclick="toggleTask('${t.id}')">${t.done?'✓':'○'}</button><div style="flex:1;min-width:0"><div class="tx"><code>${esc(t.id)}</code> ${esc(t.text)}</div>${detail(t)}<button class="btn-sm" onclick="editNote('${t.id}')">备注 / 证据</button></div><span class="tr ${esc(t.track)}">${esc(plan.tracks[t.track])}</span></div>`).join('')}
      <div class="note"><label for="note-${w.n}">W${w.n} 周备注 / 卡点（项目只读时请让 agent 记录）</label><textarea id="note-${w.n}" ${fs.mode==='snapshot'?'readonly':''} onchange="saveWeekNote(${w.n},this.value)" placeholder="实际产出 / 下一步 / 卡点">${esc(w.note||'')}</textarea></div></div></div>`;
  });
  $('weeks').innerHTML=h;renderDaily();
}
function toggleWeek(n){opened.has(n)?opened.delete(n):opened.add(n);render();}
function expandAll(v){opened=v?new Set(plan.weeks.map(w=>w.n)):new Set();render();}
function setF(f){filter=f;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c.dataset.f===f));render();}
async function toggleTask(id){
  const ok=await fs.update(p=>{
    const t=p.weeks.flatMap(w=>w.tasks).concat(p.deliverables).find(t=>t.id===id);must(t,'ID 不存在');
    const before=deepCopy(t), next=!t.done;
    if(next&&(id.startsWith('song')||['4-5','8-2','13-2','1-7'].includes(id))){
      if(!(t.evidence||[]).some(e=>/^https?:\/\//.test(e))){const url=prompt('这是发布项。请输入真实公开链接；尚未发布请取消。');must(url&&/^https?:\/\//.test(url),'未提供公开链接，不勾选发布');t.evidence.push(url);}
      must(confirm('请确认该项验收已满足。歌曲需工程、导出音频、公开链接、至少 100 字复盘；不是只完成了一个拆分动作。'),'取消验收');
    }
    t.done=next;t.completedOn=next?projectToday():null;recordEvent(p,next?'done':'undo',{ids:[id],before});
  });
  if(ok)toast(fs.mode==='file'?'已写入文件；Markdown / HTML 快照由 agent 下次同步':'仅改了草稿，请导出交给 agent');
}
async function editNote(id){
  if(fs.mode==='snapshot'){fs.status('只读快照；请在对话中描述完成内容或卡点，agent 会写回');return;}
  const t=plan.weeks.flatMap(w=>w.tasks).concat(plan.deliverables).find(t=>t.id===id);
  const note=prompt('补充这一项的备注（追加，不会把做了一小步当整项完成）', '');if(note===null||!note.trim())return;
  const evidence=prompt('产出文件路径 / 链接（可留空；公开进度不要含机台信息）','');
  await fs.update(p=>{const x=p.weeks.flatMap(w=>w.tasks).concat(p.deliverables).find(x=>x.id===id);
    x.note=[x.note,note].filter(Boolean).join('\n');if(evidence&&evidence.trim())x.evidence=[...new Set(x.evidence.concat(evidence.trim()))];recordEvent(p,'note',{ids:[id]});});
}
async function saveWeekNote(n,value){await fs.update(p=>{const w=p.weeks.find(w=>w.n===n);const before=w.note;w.note=value;recordEvent(p,'week-note',{summary:'W'+n,before});});}
async function checkin(){
  const ds=projectToday();if(plan.checkins.includes(ds)){toast('该日已打卡，不重复累计');return;}
  const ok=await fs.update(p=>{must(ds>=p.meta.day0&&ds<=p.meta.end,'日期不在本计划范围内');p.checkins.push(ds);p.checkins.sort();recordEvent(p,'checkin',{on:ds,summary:ds});});
  if(ok)toast(fs.mode==='file'?'打卡已写入文件':'打卡仅在草稿中');
}
async function resetAll(){
  if(!confirm('仅在你明确要重新开始时使用。将撤销任务 / 交付物 / 打卡并清空备注；先下载一份备份？'))return;
  if(fs.mode==='snapshot'){fs.status('只读快照，未重置任何内容');return;}
  fs.exportJSON();
  await fs.update(p=>{const before={weeks:deepCopy(p.weeks),deliverables:deepCopy(p.deliverables),checkins:p.checkins,dailyLogs:p.dailyLogs};
    p.weeks.flatMap(w=>w.tasks).concat(p.deliverables).forEach(t=>{t.done=false;t.completedOn=null;t.note='';t.evidence=[];});
    p.weeks.forEach(w=>w.note='');p.checkins=[];p.dailyLogs={};recordEvent(p,'reset',{summary:'显式重置；旧状态保存在本条历史',before});});
}
function toggleTheme(){const next=document.documentElement.dataset.theme==='light'?'dark':'light';document.documentElement.dataset.theme=next;$('themeBtn').textContent=next==='light'?'☀️':'🌙';try{localStorage.setItem('plan90_theme',next);}catch(e){}}
try{const t=localStorage.getItem('plan90_theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}
$('dailyDate').value=selectedDate;$('dailyDate').addEventListener('change',e=>{if(validDate(e.target.value)){selectedDate=e.target.value;renderDaily();}});
$('impFile').addEventListener('change',async e=>{await fs.importFile(e.target.files[0]);e.target.value='';});
opened.add(currentWeek()||1);fs.refresh();

</script>
</body>
